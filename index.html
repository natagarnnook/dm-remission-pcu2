<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DM remission clinic PCU2 ศรีพิมาน อ.เมือง จ.สตูล</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js" crossorigin="anonymous"></script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap');
    body {
      font-family: 'Sarabun', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // ตั้งค่า Supabase (ใช้ URL และ Key จากระบบของคุณหมอ)
    const SUPABASE_URL = "https://ayrxuealjhdncbivhdlz.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF5cnh1ZWFsamhkbmNiaXZoZGx6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDEyMTgwOTUsImV4cCI6MjA1Njc5NDA5NX0.8P36P_fS066M30I5eKz5k-a34241e3a6113b2c15";
    const supabase = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    // Icon Component
    const Icon = ({ name, size = 20, className = "" }) => {
      const icons = {
        users: <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75" />,
        checkCircle: <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14M22 4L12 14.01l-3-3" />,
        arrowDownCircle: <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 14l-4-4h3V8h2v4h3z" />,
        pauseCircle: <path d="M10 15E1 1 0 0 0 11 14V10E1 1 0 0 0 10 9H9E1 1 0 0 0 8 10V14E1 1 0 0 0 9 15H10ZM15 15E1 1 0 0 0 16 14V10E1 1 0 0 0 15 9H14E1 1 0 0 0 13 10V14E1 1 0 0 0 14 15H15Z M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2z" />,
        arrowUpCircle: <path d="M12 22a10 10 0 1 0-10-10 10 10 0 0 0 10 10zm0-14l4 4h-3v4h-2v-4H8z" />,
        refreshCw: <path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" />,
        slash: <path d="M22 2L2 22" />,
        activity: <path d="M22 12h-4l-3 9L9 3l-3 9H2" />,
        plus: <path d="M12 5v14M5 12h14" />,
        search: <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />,
        trash: <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2" />,
        edit: <path d="M11 4H4a2 2 0 00-2 2v12a2 2 0 002 2h12a2 2 0 002-2v-7M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z" />,
        eye: <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8zM12 15a3 3 0 100-6 3 3 0 000 6z" />,
        download: <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3" />,
        x: <path d="M18 6L6 18M6 6l12 12" />,
        calendar: <path d="M19 4H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zM16 2v4M8 2v4M3 10h18" />
      };

      return (
        <svg 
          xmlns="http://www.w3.org/2000/svg" 
          width={size} 
          height={size} 
          viewBox="0 0 24 24" 
          fill="none" 
          stroke="currentColor" 
          strokeWidth="2" 
          strokeLinecap="round" 
          strokeLinejoin="round" 
          className={className}
        >
          {icons[name] || <circle cx="12" cy="12" r="10" />}
        </svg>
      );
    };

    // 📊 ฟังก์ชันเตรียมข้อมูล HbA1c รวมทุกจุด (แรกรับ, Follow-up, หยุดยา, Remission)
    const getHbA1cChartData = (patient, visits = []) => {
      if (!patient) return [];
      const chartPoints = [];

      // 1. จุดแรกรับ (ดึง hba1c_init_date วันที่เจาะจริงย้อนหลัง)
      const initHbA1c = patient.hba1c_init || patient.hba1c;
      if (initHbA1c && parseFloat(initHbA1c) > 0) {
        chartPoints.push({
          date: patient.hba1c_init_date || patient.registered_date || patient.created_at,
          hba1c: parseFloat(initHbA1c),
          label: 'แรกรับ'
        });
      }

      // 2. จุดติดตามผล (Visits)
      if (visits && visits.length > 0) {
        visits.forEach(visit => {
          const vHbA1c = visit.hba1c;
          if (vHbA1c && parseFloat(vHbA1c) > 0) {
            chartPoints.push({
              date: visit.hba1c_date || visit.visit_date || visit.created_at,
              hba1c: parseFloat(vHbA1c),
              label: visit.notes || 'ติดตามผล'
            });
          }
        });
      }

      // 3. จุดวันที่หยุดยา / ปรับลดยา
      const stoppedDate = patient.stopped_date || patient.off_med_date;
      const stoppedHbA1c = patient.stopped_hba1c || patient.off_med_hba1c;
      if (stoppedDate && stoppedHbA1c) {
        chartPoints.push({
          date: stoppedDate,
          hba1c: parseFloat(stoppedHbA1c),
          label: '💊 หยุดยา'
        });
      }

      // 4. จุดวันที่ Remission สำเร็จ
      if (patient.remission_date && patient.remission_hba1c) {
        chartPoints.push({
          date: patient.remission_date,
          hba1c: parseFloat(patient.remission_hba1c),
          label: '🎉 Remission'
        });
      }

      // เรียงลำดับตามวันที่จากอดีต -> ปัจจุบัน
      chartPoints.sort((a, b) => new Date(a.date) - new Date(b.date));

      // กรองเอาเฉพาะวันที่ไม่ซ้ำกัน
      const uniquePoints = [];
      const seenDates = new Set();
      chartPoints.forEach(pt => {
        const formattedDate = pt.date ? pt.date.split('T')[0] : '';
        if (formattedDate && !seenDates.has(formattedDate)) {
          seenDates.add(formattedDate);
          uniquePoints.push(pt);
        }
      });

      return uniquePoints;
    };

    // ฟังก์ชันวาดกราฟ SVG
    const renderSVGChart = (data, dataKey, color, title, minVal, maxVal, unit, isHbA1cLimit = false) => {
      if (!data || data.length === 0) {
        return (
          <div className="text-slate-400 text-xs py-8 text-center bg-slate-50 rounded-lg border border-slate-100">
            ไม่มีข้อมูลเพียงพอสำหรับวาดกราฟ
          </div>
        );
      }

      const width = 800;
      const height = 210;
      const padding = 40;
      const chartWidth = width - padding * 2;
      const chartHeight = height - padding * 2;

      const values = data.map(d => d[dataKey] || 0);
      const min = minVal !== undefined ? minVal : Math.min(...values) * 0.95;
      const max = maxVal !== undefined ? maxVal : Math.max(...values) * 1.05;
      const range = max - min || 1;

      const points = data.map((d, index) => {
        const x = data.length === 1 
          ? padding + chartWidth / 2 
          : padding + (index / (data.length - 1)) * chartWidth;
        const y = height - padding - (((d[dataKey] || 0) - min) / range) * chartHeight;
        return { x, y, val: d[dataKey], date: d.date, label: d.label };
      });

      const pathD = points.reduce((acc, p, i) => i === 0 ? `M ${p.x} ${p.y}` : `${acc} L ${p.x} ${p.y}`, '');

      const formatDate = (dateStr) => {
        if (!dateStr) return '';
        const d = new Date(dateStr);
        if (isNaN(d.getTime())) return dateStr;
        const day = String(d.getDate()).padStart(2, '0');
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const year = d.getFullYear() + 543;
        return `${day}/${month}/${year}`;
      };

      return (
        <div className="w-full overflow-x-auto bg-white p-4 rounded-xl border border-slate-200 shadow-sm mb-4">
          <div className="text-sm font-bold text-slate-700 mb-3 flex items-center justify-between">
            <span>{title}</span>
            <span className="text-xs font-normal text-slate-500">หน่วย: {unit}</span>
          </div>
          <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-auto overflow-visible">
            {isHbA1cLimit && (
              <g>
                {(() => {
                  const limitY = height - padding - (((6.5) - min) / range) * chartHeight;
                  return (
                    <>
                      <line x1={padding} y1={limitY} x2={width - padding} y2={limitY} stroke="#ef4444" strokeDasharray="4 4" strokeWidth="1.5" />
                      <text x={width - padding + 5} y={limitY + 4} fill="#ef4444" fontSize="10" fontWeight="bold">เกณฑ์ 6.5%</text>
                    </>
                  );
                })()}
              </g>
            )}

            <path d={pathD} fill="none" stroke={color} strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" />

            {points.map((p, i) => (
              <g key={i}>
                <circle cx={p.x} cy={p.y} r="6" fill={color} stroke="#ffffff" strokeWidth="2.5" />
                <text x={p.x} y={p.y - 12} textAnchor="middle" fill="#1e293b" fontSize="12" fontWeight="bold">
                  {p.val}
                </text>
                {p.label && (
                  <text x={p.x} y={p.y + 18} textAnchor="middle" fill="#2563eb" fontSize="9" fontWeight="bold">
                    {p.label}
                  </text>
                )}
                <text x={p.x} y={height - 10} textAnchor="middle" fill="#64748b" fontSize="11" fontWeight="500">
                  {formatDate(p.date)}
                </text>
              </g>
            ))}
          </svg>
        </div>
      );
    };

    function App() {
      const [patients, setPatients] = useState([]);
      const [patientVisits, setPatientVisits] = useState([]);
      const [loading, setLoading] = useState(true);
      const [searchQuery, setSearchQuery] = useState('');
      const [filterStatus, setFilterStatus] = useState('all');
      const [selectedPatient, setSelectedPatient] = useState(null);
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [isDetailModalOpen, setIsDetailModalOpen] = useState(false);

      const [formData, setFormData] = useState({
        hn: '',
        first_name: '',
        last_name: '',
        age: '',
        dx_year: '',
        comorbidities: '',
        meds_before: '',
        weight: '',
        height: '',
        has_smbg: false,
        remission_status: 'in_program',
        med_status: 'uncategorized',
        registered_date: new Date().toISOString().split('T')[0],
        hba1c_init_date: '',
        hba1c_init: ''
      });

      useEffect(() => {
        fetchPatients();
      }, []);

      const fetchPatients = async () => {
        setLoading(true);
        if (supabase) {
          const { data, error } = await supabase.from('patients').select('*').order('created_at', { ascending: false });
          if (!error && data) {
            setPatients(data);
          }
        }
        setLoading(false);
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (supabase) {
          const { error } = await supabase.from('patients').insert([formData]);
          if (!error) {
            fetchPatients();
            setIsModalOpen(false);
            setFormData({
              hn: '', first_name: '', last_name: '', age: '', dx_year: '',
              comorbidities: '', meds_before: '', weight: '', height: '',
              has_smbg: false, remission_status: 'in_program', med_status: 'uncategorized',
              registered_date: new Date().toISOString().split('T')[0],
              hba1c_init_date: '', hba1c_init: ''
            });
          } else {
            alert('เกิดข้อผิดพลาดในการบันทึก: ' + error.message);
          }
        }
      };

      const filteredPatients = useMemo(() => {
        return patients.filter(p => {
          const fullName = `${p.first_name || ''} ${p.last_name || ''}`.toLowerCase();
          const matchesSearch = fullName.includes(searchQuery.toLowerCase()) || (p.hn && p.hn.includes(searchQuery));
          const matchesFilter = filterStatus === 'all' || p.remission_status === filterStatus;
          return matchesSearch && matchesFilter;
        });
      }, [patients, searchQuery, filterStatus]);

      return (
        <div className="max-w-7xl mx-auto p-4 md:p-6">
          {/* Header */}
          <div className="bg-gradient-to-r from-blue-700 to-indigo-800 text-white p-6 rounded-2xl shadow-lg mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
              <h1 className="text-2xl font-extrabold">DM Remission Clinic Dashboard</h1>
              <p className="text-blue-100 text-xs mt-1">PCU2 ศรีพิมาน อ.เมือง จ.สตูล</p>
            </div>
            <button 
              onClick={() => setIsModalOpen(true)}
              className="bg-emerald-500 hover:bg-emerald-600 text-white px-4 py-2.5 rounded-xl font-bold text-sm shadow-md transition flex items-center gap-2 cursor-pointer"
            >
              <Icon name="plus" size={18} /> ลงทะเบียนผู้ป่วยรายใหม่
            </button>
          </div>

          {/* Search & Filter */}
          <div className="bg-white p-4 rounded-xl border border-slate-200 mb-6 flex flex-col md:flex-row gap-4 justify-between items-center">
            <div className="relative w-full md:w-96">
              <input 
                type="text"
                placeholder="ค้นหาชื่อ, นามสกุล หรือ HN..."
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                className="w-full pl-10 pr-4 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
              />
              <div className="absolute left-3 top-2.5 text-slate-400">
                <Icon name="search" size={18} />
              </div>
            </div>
            <div className="text-xs text-slate-500 font-semibold">
              จำนวนผู้ป่วยทั้งหมด: <span className="text-blue-600 text-sm font-bold">{filteredPatients.length}</span> ราย
            </div>
          </div>

          {/* Patients Table */}
          <div className="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
            <table className="w-full text-left text-sm">
              <thead className="bg-slate-50 border-b border-slate-200 text-slate-600 font-semibold text-xs">
                <tr>
                  <th className="p-3">HN</th>
                  <th className="p-3">ชื่อ - นามสกุล</th>
                  <th className="p-3">อายุ (ปี)</th>
                  <th className="p-3">วันที่ลงทะเบียน</th>
                  <th className="p-3">HbA1c แรกรับ</th>
                  <th className="p-3 text-center">จัดการ</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-100">
                {filteredPatients.map(p => (
                  <tr key={p.id} className="hover:bg-slate-50">
                    <td className="p-3 font-medium text-slate-900">{p.hn}</td>
                    <td className="p-3 font-semibold text-blue-700">{p.first_name} {p.last_name}</td>
                    <td className="p-3">{p.age}</td>
                    <td className="p-3">{p.registered_date || '-'}</td>
                    <td className="p-3 font-bold text-slate-700">{p.hba1c_init ? `${p.hba1c_init}%` : '-'}</td>
                    <td className="p-3 text-center">
                      <button 
                        onClick={() => { setSelectedPatient(p); setIsDetailModalOpen(true); }}
                        className="bg-blue-50 hover:bg-blue-100 text-blue-600 px-3 py-1.5 rounded-lg text-xs font-bold transition inline-flex items-center gap-1 cursor-pointer"
                      >
                        <Icon name="eye" size={14} /> ดูรายละเอียด / กราฟ
                      </button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          {/* Modal: ลงทะเบียนผู้ป่วยรายใหม่ */}
          {isModalOpen && (
            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl max-w-2xl w-full p-6 shadow-2xl overflow-y-auto max-h-[90vh]">
                <div className="flex justify-between items-center mb-4 border-b pb-3">
                  <h2 className="text-lg font-bold text-slate-800">ลงทะเบียนผู้ป่วยเบาหวานรายใหม่</h2>
                  <button onClick={() => setIsModalOpen(false)} className="text-slate-400 hover:text-slate-600"><Icon name="x" size={20} /></button>
                </div>

                <form onSubmit={handleSubmit} className="space-y-4">
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4 bg-blue-50 p-3 rounded-xl border border-blue-100">
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">📅 วันที่ลงทะเบียนเข้าคลินิก <span className="text-red-500">*</span></label>
                      <input 
                        type="date" 
                        value={formData.registered_date}
                        onChange={(e) => setFormData({...formData, registered_date: e.target.value})}
                        className="w-full p-2 border border-slate-300 rounded-lg text-sm bg-white"
                        required
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">🩸 วันที่เจาะ HbA1c แรกรับ</label>
                      <input 
                        type="date" 
                        value={formData.hba1c_init_date}
                        onChange={(e) => setFormData({...formData, hba1c_init_date: e.target.value})}
                        className="w-full p-2 border border-slate-300 rounded-lg text-sm bg-white"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">📊 ค่า HbA1c แรกรับ (%)</label>
                      <input 
                        type="number" 
                        step="0.1"
                        placeholder="เช่น 8.5"
                        value={formData.hba1c_init}
                        onChange={(e) => setFormData({...formData, hba1c_init: e.target.value})}
                        className="w-full p-2 border border-slate-300 rounded-lg text-sm bg-white"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">HN</label>
                      <input type="text" required value={formData.hn} onChange={(e) => setFormData({...formData, hn: e.target.value})} className="w-full p-2 border border-slate-300 rounded-lg text-sm" />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">อายุ (ปี)</label>
                      <input type="number" required value={formData.age} onChange={(e) => setFormData({...formData, age: e.target.value})} className="w-full p-2 border border-slate-300 rounded-lg text-sm" />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">ชื่อ</label>
                      <input type="text" required value={formData.first_name} onChange={(e) => setFormData({...formData, first_name: e.target.value})} className="w-full p-2 border border-slate-300 rounded-lg text-sm" />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">นามสกุล</label>
                      <input type="text" required value={formData.last_name} onChange={(e) => setFormData({...formData, last_name: e.target.value})} className="w-full p-2 border border-slate-300 rounded-lg text-sm" />
                    </div>
                  </div>

                  <div className="flex justify-end gap-2 pt-4 border-t">
                    <button type="button" onClick={() => setIsModalOpen(false)} className="px-4 py-2 bg-slate-100 text-slate-600 rounded-lg text-xs font-bold">ยกเลิก</button>
                    <button type="submit" className="px-4 py-2 bg-blue-600 text-white rounded-lg text-xs font-bold shadow-md hover:bg-blue-700">บันทึกข้อมูล</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Modal: ดูรายละเอียด + กราฟผู้ป่วย */}
          {isDetailModalOpen && selectedPatient && (
            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl max-w-3xl w-full p-6 shadow-2xl overflow-y-auto max-h-[90vh]">
                <div className="flex justify-between items-center mb-4 border-b pb-3">
                  <div>
                    <h2 className="text-lg font-bold text-slate-800">รายละเอียดผู้ป่วย: {selectedPatient.first_name} {selectedPatient.last_name}</h2>
                    <p className="text-xs text-slate-500">HN: {selectedPatient.hn} | อายุ: {selectedPatient.age} ปี</p>
                  </div>
                  <button onClick={() => setIsDetailModalOpen(false)} className="text-slate-400 hover:text-slate-600"><Icon name="x" size={20} /></button>
                </div>

                {/* 📊 กราฟ HbA1c */}
                <div className="mb-6">
                  {renderSVGChart(
                    getHbA1cChartData(selectedPatient, patientVisits),
                    'hba1c',
                    '#2563eb',
                    '📊 พัฒนาการระดับ HbA1c (%)',
                    4,
                    14,
                    '%',
                    true
                  )}
                </div>

                <div className="flex justify-end pt-4 border-t">
                  <button onClick={() => setIsDetailModalOpen(false)} className="px-4 py-2 bg-slate-100 text-slate-600 rounded-lg text-xs font-bold">ปิดหน้าต่าง</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const rootEl = document.getElementById('root');
    if (rootEl) {
      ReactDOM.createRoot(rootEl).render(<App />);
    }
  </script>
</body>
</html>
