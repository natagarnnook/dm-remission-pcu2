      const [errorMessage, setErrorMessage] = useState(null);

        try {
          localStorage.setItem('DM_CLINIC_PATIENTS', JSON.stringify(patients));
        } catch(e) { console.error("LocalStorage patients save error", e); }
      }, [patients]);

        try {
          localStorage.setItem('DM_CLINIC_USERS', JSON.stringify(users));
        } catch(e) { console.error("LocalStorage users save error", e); }
      }, [users]);

          try {
            const client = window.supabase.createClient(supabaseUrl, supabaseKey);
            setSupabaseClient(client);
            setSupabaseStatus('connected');

            // Fetch patients from Supabase
            client.from('patients').select('*').then(({ data, error }) => {
              if (error) {
                console.error("Supabase fetch patients error:", error);
                setSupabaseStatus('error');
              } else if (data && data.length > 0) {
                setPatients(data);
              }
            });

            // Fetch users from Supabase
            client.from('users').select('*').then(({ data, error }) => {
              if (error) console.error("Supabase fetch users error:", error);
              else if (data && data.length > 0) {
                setUsers(data);

      const renderSVGChart = (data, dataKey, color, title, minVal, maxVal, unit, isHbA1cLimit = false) => {
        if (!data || data.length === 0) return <div className="text-slate-400 text-xs py-8 text-center">ไม่มีข้อมูลเพียงพอสำหรับวาดกราฟ</div>;
        
        const width = 800; const height = 180; const padding = 35;
        const chartWidth = width - padding * 2; const chartHeight = height - padding * 2;

        const values = data.map(d => d[dataKey] || 0);
        const min = minVal !== undefined ? minVal : Math.min(...values) * 0.95;
        const max = maxVal !== undefined ? maxVal : Math.max(...values) * 1.05;
        const range = max - min || 1;

        const points = data.map((d, index) => {
          const x = padding + (index / (data.length - 1 || 1)) * chartWidth;
          const val = d[dataKey] || 0;
          const y = padding + chartHeight - ((val - min) / range) * chartHeight;

        });

        const stoppedVisitIndex = data.findIndex(v => 
          (selectedPatient?.stoppedDate && v.date === selectedPatient.stoppedDate) || v.action === 'stopped'
        );

                <h3 className="font-extrabold text-slate-800 text-base">ยืนยันการลบรายชื่อผู้ป่วย</h3>
                <p className="text-xs text-slate-500 leading-relaxed">
                  คุณต้องการลบข้อมูลของ <span className="font-bold text-slate-800">{patientToDelete.firstName} {patientToDelete.lastName} ({patientToDelete.id})</span> ออกจากระบบหรือไม่? <br/>
                  <span className="text-rose-600 font-bold">*ประวัติการตรวจทั้งหมดของผู้ป่วยคนนี้จะถูกลบไปด้วย*</span>
                </p>
                <div className="flex gap-2 pt-2">
                  <button
                    onClick={() => setPatientToDelete(null)}
                    className="flex-1 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl text-xs font-bold transition cursor-pointer"
                  >
                    ยกเลิก
                  </button>
                  <button
                    onClick={() => handleDeletePatient(patientToDelete.id)}
                    className="flex-1 py-2.5 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-xs font-bold transition shadow-sm cursor-pointer"
                  >
                    ยืนยันการลบ
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Supabase Connection Setup Modal */}
          {isSupabaseModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-900/80 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl border border-slate-100 space-y-5">
                <div className="flex justify-between items-center border-b pb-3">
                  <div className="flex items-center gap-2">
                    <div className="p-2 bg-teal-100 text-teal-800 rounded-xl"><Icon name="database" size={20}/></div>
                    <div>
                      <h3 className="font-extrabold text-slate-800 text-base">ตั้งค่าเชื่อมต่อ Supabase Cloud Database</h3>
                      <p className="text-xs text-slate-400">วาง Project URL และ API Key เพื่อซิงค์ข้อมูลระหว่างเครื่อง</p>
                    </div>
                  </div>
                  <button onClick={() => setIsSupabaseModalOpen(false)} className="text-slate-400 hover:text-slate-600 text-lg font-bold p-1 cursor-pointer">✕</button>
                </div>

                <div className="space-y-3.5 text-xs">
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">1. Supabase Project URL</label>
                    <input 
                      type="text" 
                      value={supabaseUrl} 
                      onChange={(e) => setSupabaseUrl(e.target.value)} 
                      placeholder="https://xxxxxxxx.supabase.co"
                      className="w-full px-3 py-2 rounded-xl border border-slate-200 text-xs font-mono focus:ring-2 focus:ring-teal-500/20"
                    />
                  </div>

                  <div>
                    <label className="block font-bold text-slate-700 mb-1">2. Supabase Anon / Public Key</label>
                    <textarea 
                      value={supabaseKey} 
                      onChange={(e) => setSupabaseKey(e.target.value)} 
                      placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                      rows="3"
                      className="w-full px-3 py-2 rounded-xl border border-slate-200 text-xs font-mono focus:ring-2 focus:ring-teal-500/20"
                    ></textarea>
                  </div>

                  <div className="p-3 bg-teal-50 text-teal-900 rounded-2xl border border-teal-100 leading-relaxed text-[11px]">
                    💡 <b>คำแนะนำ:</b> หากยังไม่เคยตั้งค่า Supabase สามารถใช้งานในโหมด LocalStorage ต่อได้ทันที ข้อมูลจะไม่สูญหายเมื่อเปิดใช้งานบนเครื่องเดิมครับ
                  </div>
                </div>

                <div className="pt-3 border-t border-slate-100 flex gap-2">
                  <button onClick={() => setIsSupabaseModalOpen(false)} className="w-1/3 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl text-xs font-bold transition cursor-pointer">ปิด</button>
                  <button onClick={() => saveSupabaseCredentials(supabaseUrl, supabaseKey)} className="w-2/3 py-2.5 bg-teal-600 hover:bg-teal-700 text-white rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 cursor-pointer">
                    <Icon name="check" size={16}/> บันทึกการเชื่อมต่อ Cloud
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* User Management Modal */}
          {isUserMgmtOpen && (
            <div className="fixed inset-0 z-50 bg-slate-900/80 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl border border-slate-100 space-y-5 max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center border-b pb-3">
                  <div className="flex items-center gap-2">
                    <div className="p-2 bg-teal-100 text-teal-800 rounded-xl"><Icon name="user-cog" size={20}/></div>
                    <div>
                      <h3 className="font-extrabold text-slate-800 text-base">จัดการผู้ใช้งานระบบ (User Management)</h3>
                      <p className="text-xs text-slate-400">เพิ่มหรือดูรายชื่อบุคลากรที่มีสิทธิ์เข้าใช้งานระบบ</p>
                    </div>
                  </div>
                  <button onClick={() => setIsUserMgmtOpen(false)} className="text-slate-400 hover:text-slate-600 text-lg font-bold p-1 cursor-pointer">✕</button>
                </div>

                <div className="space-y-2.5">
                  <span className="text-xs font-extrabold text-slate-500 uppercase tracking-wider block">รายชื่อผู้ใช้งานปัจจุบัน ({users.length})</span>
                  <div className="space-y-2 max-h-48 overflow-y-auto pr-1">
                    {users.map(u => (
                      <div key={u.id} className="p-3 bg-slate-50 rounded-2xl border border-slate-100 flex justify-between items-center text-xs">
                        <div>
                          <div className="font-bold text-slate-800 flex items-center gap-1.5">
                            {u.name} <span className="px-2 py-0.5 bg-teal-100 text-teal-800 rounded-full text-[10px]">{u.roleLabel || u.role}</span>
                          </div>
                          <div className="text-[11px] text-slate-400">Email: {u.email} | PIN: {u.pin}</div>
                        </div>
                        {users.length > 1 && (
                          <button onClick={() => handleDeleteUser(u.id)} className="text-rose-500 hover:text-rose-700 p-1.5 rounded-lg hover:bg-rose-50 transition cursor-pointer" title="ลบผู้ใช้งาน">
                            <Icon name="trash-2" size={15}/>
                          </button>
                        )}
                      </div>
                    ))}
                  </div>
                </div>

                <form onSubmit={handleAddUserFromAdmin} className="pt-3 border-t border-slate-100 space-y-3">
                  <span className="text-xs font-extrabold text-teal-800 uppercase tracking-wider block">+ เพิ่มผู้ใช้งานระบบรายใหม่</span>
                  
                  <div>
                    <label className="block text-[10px] font-bold text-slate-500 mb-1">ชื่อ - นามสกุล *</label>
                    <input 
                      type="text" 
                      value={newAdminUserName}
                      onChange={(e) => setNewAdminUserName(e.target.value)}
                      placeholder="เช่น พญ. สมใจ รักเรียน"
                      className="w-full px-3 py-1.5 rounded-xl border border-slate-200 text-xs focus:ring-2 focus:ring-teal-500/20"
                      required
                    />
                  </div>

                  <div>
                    <label className="block text-[10px] font-bold text-slate-500 mb-1">อีเมล *</label>
                    <input 
                      type="email" 
                      value={newAdminUserEmail}
                      onChange={(e) => setNewAdminUserEmail(e.target.value)}
                      placeholder="doctor2@clinic.com"
                      className="w-full px-3 py-1.5 rounded-xl border border-slate-200 text-xs focus:ring-2 focus:ring-teal-500/20"
                      required
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-[10px] font-bold text-slate-500 mb-1">รหัส PIN 4 หลัก *</label>
                      <input 
                        type="password" 
                        maxLength={4}
                        value={newAdminUserPin}
                        onChange={(e) => setNewAdminUserPin(e.target.value.replace(/\D/g, ''))}
                        placeholder="9999"
                        className="w-full px-3 py-1.5 rounded-xl border border-slate-200 text-xs text-center font-bold tracking-widest focus:ring-2 focus:ring-teal-500/20"
                        required
                      />
                    </div>

                    <div>
                      <label className="block text-[10px] font-bold text-slate-500 mb-1">ตำแหน่ง *</label>
                      <select
                        value={newAdminUserRole}
                        onChange={(e) => setNewAdminUserRole(e.target.value)}
                        className="w-full px-2.5 py-1.5 rounded-xl border border-slate-200 text-xs bg-white"
                      >
                        <option value="doctor">แพทย์</option>
                        <option value="nurse">พยาบาล</option>
                        <option value="admin">แพทย์ผู้ดูแลระบบ</option>
                        <option value="staff">เจ้าหน้าที่สาธารณสุข</option>
                      </select>
                    </div>
                  </div>

                  <div className="pt-2 flex gap-2">
                    <button type="button" onClick={() => setIsUserMgmtOpen(false)} className="w-1/3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl text-xs font-bold transition cursor-pointer">ปิดหน้าต่าง</button>
                    <button type="submit" className="w-2/3 py-2 bg-teal-600 hover:bg-teal-700 text-white rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 cursor-pointer">
                      <Icon name="user-plus" size={15}/> บันทึกเพิ่มผู้ใช้งาน
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Export CSV Modal */}
          {isExportModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-900/80 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl border border-slate-100 space-y-5">
                <div className="flex justify-between items-center border-b pb-3">
                  <div className="flex items-center gap-2">
                    <div className="p-2 bg-emerald-100 text-emerald-800 rounded-xl"><Icon name="download" size={20}/></div>
                    <div>
                      <h3 className="font-extrabold text-slate-800 text-base">ส่งออกรายงานสรุป Excel (.csv)</h3>
                      <p className="text-xs text-slate-400">กำหนดตัวเลือกการดึงข้อมูลเพื่อนำไปวิเคราะห์ต่อ</p>
                    </div>
                  </div>
                  <button onClick={() => setIsExportModalOpen(false)} className="text-slate-400 hover:text-slate-600 text-lg font-bold p-1 cursor-pointer">✕</button>
                </div>

                <div className="space-y-4 text-xs">
                  <div>
                    <label className="font-extrabold text-slate-700 uppercase tracking-wider block mb-2">1. เลือกขอบเขตข้อมูลที่ต้องการส่งออก</label>
                    <div className="space-y-2">
                      <label className="flex items-center gap-2 p-2.5 rounded-xl border border-slate-200 bg-slate-50 cursor-pointer">
                        <input type="radio" name="exportScope" value="all" checked={exportScope === 'all'} onChange={() => setExportScope('all')} className="text-teal-600" />
                        <span className="font-bold text-slate-800">คนไข้ทั้งหมดในคลินิก ({patients.length} ราย)</span>
                      </label>
                      <label className="flex items-center gap-2 p-2.5 rounded-xl border border-slate-200 bg-slate-50 cursor-pointer">
                        <input type="radio" name="exportScope" value="filtered" checked={exportScope === 'filtered'} onChange={() => setExportScope('filtered')} className="text-teal-600" />
                        <span className="font-bold text-slate-800">เฉพาะตามตัวกรองคำค้นหาปัจจุบัน ({filteredPatients.length} ราย)</span>
                      </label>
                    </div>
                  </div>

                  <div>
                    <label className="font-extrabold text-slate-700 uppercase tracking-wider block mb-2">2. เลือกคอลัมน์ข้อมูลที่จะใส่ในไฟล์</label>
                    <div className="grid grid-cols-2 gap-2 bg-slate-50 p-3 rounded-2xl border border-slate-100">
                      {Object.keys(exportColumns).map(colKey => (
                        <label key={colKey} className="flex items-center gap-2 font-semibold text-slate-700 cursor-pointer">
                          <input 
                            type="checkbox" 
                            checked={exportColumns[colKey]} 
                            onChange={(e) => setExportColumns(prev => ({ ...prev, [colKey]: e.target.checked }))}
                            className="rounded text-teal-600"
                          />
                          <span>
                            {colKey === 'id' && 'รหัสผู้ป่วย'}
                            {colKey === 'name' && 'ชื่อ - นามสกุล'}
                            {colKey === 'age' && 'อายุ'}
                            {colKey === 'weightChange' && 'ประวัติน้ำหนักตัว'}
                            {colKey === 'hba1cInitial' && 'HbA1c แรกรับ'}
                            {colKey === 'hba1cLatest' && 'HbA1c ล่าสุด'}
                            {colKey === 'medPlan' && 'แผนปรับยาล่าสุด'}
                            {colKey === 'stoppedDate' && 'วันที่หยุดยาจริง'}
                            {colKey === 'remissionStatus' && 'สถานะ Remission'}
                          </span>
                        </label>
                      ))}
                    </div>
                  </div>
                </div>

                <div className="pt-3 border-t border-slate-100 flex gap-2">
                  <button onClick={() => setIsExportModalOpen(false)} className="w-1/3 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl text-xs font-bold transition cursor-pointer">ยกเลิก</button>
                  <button onClick={handleExportCSV} className="w-2/3 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 cursor-pointer">
                    <Icon name="download" size={16}/> ดาวน์โหลดไฟล์ Excel (.csv)
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const rootEl = document.getElementById('root');
    if (rootEl) {
      rootEl.setAttribute('data-rendered', 'true');
      const root = ReactDOM.createRoot(rootEl);
      root.render(<App />);
    }
  </script>
</body>
</html>
